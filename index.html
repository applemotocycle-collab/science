  :root{
    --bg-base:#fffdf7;
    --bg-surface:#ffffff;
    --bg-surface-2:#f5f2e8;
    --ink:#1b2a4a;
    --ink-soft:#5c6b85;
    --ink-faint:#667186;
    --navy:#1b2a4a;
    --navy-dim:#e8ecf3;
    --yellow:#ffd93d;
    --yellow-dark:#f4c200;
    --yellow-dim:#fff6d6;
    --silver:#8a94a3;
    --silver-dim:#eef0f3;
    --border:#eee7d4;
    --pill-green-bg:#dcfce7; --pill-green-ink:#15803d;
    --pill-blue-bg:#dbeafe; --pill-blue-ink:#1d4ed8;
    --pill-purple-bg:#f3e8ff; --pill-purple-ink:#7e22ce;
    --pill-teal-bg:#ccfbf1; --pill-teal-ink:#0f766e;
    --pill-coral-bg:#ffe4e0; --pill-coral-ink:#c2410c;
    --font-cn:'Noto Sans TC',sans-serif;
    --font-serif:'Noto Serif TC',serif;
    --font-tech:'Rajdhani',sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth; scroll-padding-top:24px;}

  body{
    background-repeat: repeat;
    background-size: auto, 820px auto;
    background-image:
      linear-gradient(rgba(255,253,247,.78), rgba(255,253,247,.78)),
      var(--bg-pattern, url('./assets/bg-pattern-1.webp'));
    color:var(--ink);
    font-family:var(--font-cn);
    line-height:1.6;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  a{color:inherit; text-decoration:none;}

  :focus-visible{
    outline:2px solid var(--navy);
    outline-offset:3px;
    border-radius:4px;
  }

  button, input{font-family:inherit;}

  .wrap{
    position:relative;
    z-index:1;
    max-width:1180px;
    margin:0 auto;
    padding:0 24px;
  }

  /* ===== Corner nav (top-right floating menu) ===== */
  .corner-nav{
    position:fixed;
    top:18px; right:18px;
    z-index:30;
  }

  .corner-nav-toggle{
    width:48px; height:48px;
    border-radius:14px;
    border:1px solid var(--border);
    background:rgba(255,253,250,.92);
    backdrop-filter:blur(10px);
    box-shadow:0 8px 20px -8px rgba(28,39,64,.25);
    display:flex; align-items:center; justify-content:center;
    font-size:1.2rem;
    color:var(--navy);
    cursor:pointer;
    position:relative;
  }

  .corner-nav-toggle .dot{
    position:absolute;
    top:8px; right:8px;
    width:7px; height:7px;
    border-radius:50%;
    background:var(--yellow);
    box-shadow:0 0 6px var(--yellow);
    animation:pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .corner-nav-panel{
    position:absolute;
    top:56px; right:0;
    width:220px;
    background:rgba(255,253,250,.97);
    backdrop-filter:blur(10px);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    box-shadow:0 16px 34px -10px rgba(28,39,64,.28);
    transform:translateY(8px) scale(.97);
    opacity:0;
    pointer-events:none;
    transition:all .2s ease;
  }

  .corner-nav-panel.open{
    transform:translateY(0) scale(1);
    opacity:1;
    pointer-events:auto;
  }

  .nav-brand{
    font-family:var(--font-serif);
    font-weight:900;
    font-size:.94rem;
    color:var(--ink);
    padding-bottom:10px;
    margin-bottom:10px;
    border-bottom:1px solid var(--border);
  }

  .nav-links{
    display:flex;
    flex-direction:column;
    gap:11px;
  }

  .nav-links a{
    font-size:.88rem;
    color:var(--ink-soft);
    transition:color .18s ease;
  }

  .nav-links a:hover{ color:var(--navy); }

  /* ===== Hero ===== */
  .hero{ padding:64px 0 60px; }

  .hero-inner{
    display:grid;
    grid-template-columns:1fr 1.05fr;
    gap:44px;
    align-items:center;
  }

  /* 首頁文字區改用跟手繪插圖同一套水彩色系（取樣自插圖本身的顏色） */
  .hero-text{
    --ink:#4a3c2c;
    --ink-soft:#6e5d49;
  }

  .pill-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
  }

  .pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:6px 14px;
    border-radius:999px;
    font-size:.78rem;
    font-weight:700;
    white-space:nowrap;
  }

  /* 首頁膠囊標籤：取樣自手繪插圖本身的水彩色系（鼠尾草綠／淡藍／赭紅／深青綠） */
  .pill-green{ background:#eef0e2; color:#5c6b4a; }
  .pill-blue{ background:#e8f1f4; color:#3f6b7d; }
  .pill-purple{ background:#f7e9e7; color:#9c5a52; }
  .pill-teal{ background:#e6efe9; color:#3f6358; }
  .pill-coral{ background:var(--pill-coral-bg); color:var(--pill-coral-ink); }

  .headline-highlight{
    display:inline-block;
    background:#dcb56c;
    padding:2px 14px;
    border-radius:12px;
    transform:rotate(-1deg);
    margin-top:4px;
  }

  .hero h1{
    font-family:var(--font-serif);
    font-size:clamp(2rem, 4.2vw, 3.1rem);
    font-weight:900;
    color:var(--ink);
    line-height:1.15;
  }

  .hero p.subtitle{
    font-family:var(--font-serif);
    margin-top:14px;
    font-size:clamp(1.05rem, 1.6vw, 1.2rem);
    font-weight:600;
    color:var(--ink-soft);
    max-width:440px;
  }

  .hero-cta{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:26px;
    padding:15px 28px;
    background:#dcb56c;
    color:#4a3c2c;
    font-family:var(--font-serif);
    font-weight:900;
    font-size:1.02rem;
    border:none;
    border-radius:14px;
    cursor:pointer;
    overflow:hidden;
    box-shadow:0 6px 0 #a9824a;
    transition:background .2s ease, box-shadow .15s ease, transform .15s ease;
  }

  .hero-cta::before{
    content:'';
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,.5), transparent);
    transform:skewX(-20deg);
    transition:left .55s ease;
  }

  .hero-cta:hover{
    transform:translateY(2px);
    box-shadow:0 4px 0 #a9824a;
  }

  .hero-cta:hover::before{ left:130%; }
  .hero-cta:active{ transform:translateY(6px); box-shadow:0 0 0 #a9824a; }

  /* ===== Two-page flow ===== */
  .page{ animation:page-in .45s ease both; }
  .page.hidden{ display:none; }

  .page.leaving{
    animation:none;
    opacity:0;
    transform:translateY(-14px) scale(.99);
    transition:opacity .32s ease, transform .32s cubic-bezier(.3,0,.6,1);
    pointer-events:none;
  }

  .page-start{
    min-height:100vh;
    display:flex;
    align-items:center;
  }

  @media (max-height:520px) and (orientation:landscape){
    .page-start{ min-height:auto; padding:18px 0; }
    .hero{ padding:14px 0; }
    .hero-inner{ gap:28px; }
    .pill-row{ margin-bottom:10px; }
    .hero h1{ font-size:1.5rem; }
    .headline-highlight{ padding:0 10px; }
    .hero p.subtitle{ margin-top:8px; }
    .hero-cta{ margin-top:10px; padding:9px 20px; }
    .hero-visual{ max-width:200px; }
  }

  @keyframes page-in{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---- hero visual (character frame + reactor glow) ---- */
  .hero-visual{
    position:relative;
    width:100%;
    max-width:460px;
    margin:0 auto;
    aspect-ratio:4/5;
  }

  .hero-reactor-bg{
    position:absolute;
    inset:-18% -10%;
    z-index:0;
    opacity:.85;
    pointer-events:none;
  }

  .hero-reactor-bg svg{ width:100%; height:100%; overflow:visible; }

  .hero-frame{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    border-radius:22px;
    box-shadow:0 18px 40px -18px rgba(74,60,44,.35);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .hero-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }


  /* ===== reactor keyframes (shared) ===== */
  .reactor-ring-outer{ transform-origin:100px 100px; animation:spin-cw 22s linear infinite; }
  .reactor-ring-mid{ transform-origin:100px 100px; animation:spin-ccw 15s linear infinite; }
  .reactor-ring-inner{ transform-origin:100px 100px; animation:spin-cw 9s linear infinite; }
  .reactor-core{ animation:core-pulse 2.4s ease-in-out infinite; transform-origin:100px 100px; }

  @keyframes spin-cw{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @keyframes spin-ccw{ from{transform:rotate(0deg);} to{transform:rotate(-360deg);} }
  @keyframes core-pulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.82; transform:scale(1.06);} }

  /* ===== Scroll-reveal (fade + slide up on first view) ===== */
  .reveal{
    opacity:0;
    transform:translateY(22px);
    transition:opacity .55s ease, transform .55s cubic-bezier(.2,.8,.3,1);
  }
  .reveal.in-view{
    opacity:1;
    transform:translateY(0);
  }
  /* stagger children slightly for a nicer wave effect */
  .reveal:nth-child(2){ transition-delay:.06s; }
  .reveal:nth-child(3){ transition-delay:.12s; }
  .reveal:nth-child(4){ transition-delay:.18s; }

  /* ===== How it works (4-step flow) ===== */
  .quote-strip{
    padding:56px 0;
    text-align:center;
  }

  .quote-strip .quote-mark{
    font-family:var(--font-serif);
    font-size:2.2rem;
    color:var(--yellow-dark);
    line-height:1;
    margin-bottom:6px;
  }

  .quote-strip p{
    font-family:var(--font-serif);
    font-size:clamp(1.1rem, 2.4vw, 1.5rem);
    font-weight:700;
    color:var(--ink);
    max-width:620px;
    margin:0 auto;
    line-height:1.7;
    letter-spacing:.02em;
  }

  .quote-strip .quote-rule{
    width:min(320px, 70%);
    margin:14px auto 0;
  }
  .quote-strip .quote-rule img{ width:100%; height:auto; display:block; }

  /* ===== Search & filters ===== */
  .controls{ padding:8px 0 32px; }

  .search-row{
    max-width:480px;
    margin:0 auto 20px;
    position:relative;
  }

  .search-row input{
    width:100%;
    padding:14px 18px 14px 44px;
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--ink);
    font-size:.95rem;
    transition:border-color .2s, box-shadow .2s;
  }

  .search-row input::placeholder{ color:var(--ink-faint); }

  .search-row input:focus{
    border-color:var(--navy);
    box-shadow:0 0 0 3px var(--navy-dim);
    outline:none;
  }

  .search-icon{
    position:absolute;
    left:16px; top:50%;
    transform:translateY(-50%);
    color:var(--ink-faint);
    font-size:1rem;
    pointer-events:none;
  }

  .filter-groups{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
  }

  .chip{
    padding:8px 18px;
    border-radius:20px;
    border:2px solid var(--border);
    background:var(--bg-surface);
    color:var(--ink-soft);
    font-size:.85rem;
    font-weight:700;
    cursor:pointer;
    transition:all .18s ease;
    white-space:nowrap;
  }

  .chip:hover{ border-color:var(--yellow-dark); color:var(--navy); }

  .chip.active{
    background:var(--yellow);
    border-color:var(--yellow-dark);
    color:var(--navy);
  }

  /* ===== Section heading ===== */
  .section-head{
    text-align:center;
    margin-bottom:28px;
  }

  .section-head h2{
    font-family:var(--font-serif);
    font-size:clamp(1.4rem, 2.6vw, 1.9rem);
    font-weight:900;
    color:var(--ink);
  }

  .section-head p{
    margin-top:8px;
    color:var(--ink-soft);
    font-size:.92rem;
  }


  /* ===== 遊戲探索頁：沿用首頁文字風格（襯線體＋金褐色底色標籤） ===== */
  .page-games{ --ink:#4a3c2c; --ink-soft:#6e5d49; }
  .page-games .quote-strip p{
    display:inline-block;
    background:rgba(220,181,108,.28);
    padding:10px 22px;
    border-radius:14px;
  }
  .page-games .quote-strip .quote-mark{ color:#a9824a; }
  .page-games .section-head h2{
    display:table;
    margin:0 auto;
    background:#dcb56c;
    color:#4a3c2c;
    padding:2px 18px;
    border-radius:12px;
    transform:rotate(-1deg);
    font-size:clamp(1.5rem, 3vw, 2.1rem);
  }
  .page-games .section-head p{
    display:table;
    margin:14px auto 0;
    font-family:var(--font-serif);
    font-weight:700;
    font-size:clamp(.98rem, 1.5vw, 1.1rem);
    color:#6e5d49;
    background:rgba(220,181,108,.22);
    padding:5px 16px;
    border-radius:999px;
  }
  .page-games .chip{
    font-family:var(--font-serif);
    font-size:.95rem;
    background:rgba(255,253,247,.85);
    border-color:#e4d6b8;
    color:#6e5d49;
  }
  .page-games .chip:hover{ border-color:#dcb56c; color:#4a3c2c; }
  .page-games .chip.active{
    background:#dcb56c;
    border-color:#a9824a;
    color:#4a3c2c;
    box-shadow:0 3px 0 #a9824a;
  }
  .page-games .search-row input{ border-color:#e4d6b8; font-family:var(--font-serif); }
  .page-games .search-row input:focus{ border-color:#dcb56c; }
  .page-games .about-card h3{ font-size:1.25rem; }
  .page-games .about-card p{ font-family:var(--font-serif); font-weight:600; }
  .page-games footer{ font-family:var(--font-serif); color:#6e5d49; }

  /* ===== Game grid — HUD panel cards ===== */
  .grid-section{ padding-bottom:80px; }

  .empty-state{
    text-align:center;
    color:var(--ink-faint);
    padding:60px 20px;
    display:none;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    gap:24px;
  }

  /* 四組卡片主題色，輪流套用在不同遊戲上（博物館卡片風格） */
  .card.accent-teal   { --accent-ink:var(--pill-teal-ink);   --accent-bg:var(--pill-teal-bg); }
  .card.accent-blue   { --accent-ink:var(--pill-blue-ink);   --accent-bg:var(--pill-blue-bg); }
  .card.accent-gold   { --accent-ink:#92650a;                --accent-bg:#fdf1d6; }
  .card.accent-green  { --accent-ink:var(--pill-green-ink);  --accent-bg:var(--pill-green-bg); }

  .card{
    --accent-ink:var(--navy);
    --accent-bg:var(--bg-surface-2);
    background:linear-gradient(160deg, var(--accent-bg) 0%, var(--bg-surface) 55%);
    border:1px solid var(--border);
    border-top:4px solid var(--accent-ink);
    border-radius:16px;
    padding:26px 24px 22px;
    display:flex;
    flex-direction:column;
    gap:12px;
    position:relative;
    overflow:hidden;
    transition:transform .2s cubic-bezier(.2,.8,.3,1), box-shadow .2s ease;
  }

  .card:hover{
    transform:translateY(-5px);
    box-shadow:0 16px 28px -14px rgba(27,42,74,.22);
  }

  .card-icon{
    width:60px; height:60px;
    border-radius:16px;
    background:var(--accent-bg);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    flex-shrink:0;
    box-shadow:0 4px 10px -4px rgba(27,42,74,.2);
  }

  .card-icon-emoji{ font-size:1.7rem; line-height:1; }

  .card-icon img{
    width:100%;
    height:100%;
    object-fit:contain;
  }

  .card-eyebrow{
    font-size:.74rem;
    font-weight:700;
    color:var(--accent-ink);
    letter-spacing:.06em;
    margin-top:4px;
  }

  .card h3{
    font-family:var(--font-serif);
    font-size:1.28rem;
    font-weight:700;
    color:var(--ink);
    line-height:1.3;
  }

  .card .desc{
    font-size:.88rem;
    color:var(--ink-soft);
    flex:1;
    line-height:1.65;
  }

  .meter-row{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .meter-label{
    font-size:.72rem;
    color:var(--ink-faint);
    font-family:var(--font-tech);
  }

  .difficulty-label{
    font-size:.72rem;
    font-weight:700;
    color:var(--ink-soft);
    background:var(--bg-surface-2);
    padding:2px 8px;
    border-radius:8px;
  }

  .meter{
    display:flex;
    gap:3px;
  }

  .meter span{
    width:14px; height:6px;
    border-radius:2px;
    background:var(--bg-surface-2);
    border:1px solid var(--border);
  }

  .meter span.on{
    background:var(--accent-ink);
    border-color:var(--accent-ink);
  }

  .play-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:4px;
    font-weight:700;
    font-size:.92rem;
    color:var(--accent-ink);
    transition:gap .2s ease;
  }

  .play-link:hover{ gap:11px; }

  .played-mark{
    position:absolute;
    top:18px; right:18px;
    font-size:.68rem;
    color:var(--pill-green-ink);
    background:var(--pill-green-bg);
    border:1px solid var(--border);
    padding:3px 9px;
    border-radius:8px;
    display:none;
    font-family:var(--font-tech);
    letter-spacing:.02em;
  }

  .card.is-played .played-mark{ display:inline-block; }


  /* ===== 遊戲卡片：沿用首頁風格（暖米色底、襯線字、金褐色底色標籤與按鈕） ===== */
  .card.accent-teal  { --accent-ink:#3f6358; --accent-bg:#e6efe9; }
  .card.accent-blue  { --accent-ink:#3f6b7d; --accent-bg:#e8f1f4; }
  .card.accent-gold  { --accent-ink:#8a6a2f; --accent-bg:#f6ead0; }
  .card.accent-green { --accent-ink:#5c6b4a; --accent-bg:#eef0e2; }
  .card{
    background:linear-gradient(165deg, var(--accent-bg) 0%, #fffdf7 62%);
    border:1px solid #e9dcc0;
    border-top:4px solid #dcb56c;
    box-shadow:0 10px 22px -16px rgba(74,60,44,.35);
  }
  .card:hover{ box-shadow:0 18px 30px -16px rgba(74,60,44,.4); }
  .card-icon{ border-color:#e9dcc0; background:#fffaf0; box-shadow:0 4px 10px -4px rgba(74,60,44,.25); }
  .card-eyebrow{
    align-self:flex-start;
    background:var(--accent-bg);
    color:var(--accent-ink);
    border:1px solid rgba(74,60,44,.08);
    padding:3px 11px;
    border-radius:999px;
    font-size:.76rem;
    margin-top:6px;
  }
  .card h3{
    font-weight:900;
    color:#4a3c2c;
    font-size:1.38rem;
  }
  .card .desc{
    font-family:var(--font-serif);
    font-weight:600;
    color:#6e5d49;
    font-size:.93rem;
  }
  .meter-label{ font-family:var(--font-serif); color:#8a7a62; font-size:.78rem; }
  .meter span{ border-color:#e4d6b8; background:#f6efdd; }
  .meter span.on{ background:#c79d52; border-color:#a9824a; }
  .difficulty-label{ background:#f3e6c8; color:#6e5d49; font-family:var(--font-serif); }
  .play-link{
    align-self:flex-start;
    margin-top:6px;
    padding:8px 18px;
    border-radius:12px;
    background:#dcb56c;
    color:#4a3c2c;
    font-family:var(--font-serif);
    font-weight:900;
    box-shadow:0 3px 0 #a9824a;
    transition:gap .2s ease, transform .15s ease, box-shadow .15s ease;
  }
  .play-link:hover{ transform:translateY(-1px); box-shadow:0 4px 0 #a9824a; }
  .play-link:active{ transform:translateY(2px); box-shadow:0 1px 0 #a9824a; }
  .played-mark{ background:#eef0e2; color:#5c6b4a; border-color:#d9dcc2; font-family:var(--font-serif); font-weight:700; }



  /* ===== 篩選區留白調整：標題區與操作區分開，搜尋與篩選自成一組 ===== */
  .controls{ padding:28px 0 28px; }
  .page-games .section-head{ margin-bottom:40px; }
  .page-games .section-head h2{ padding:4px 22px; }
  .page-games .section-head p{ margin-top:20px; padding:7px 20px; }
  .search-row{ max-width:520px; margin:0 auto 26px; }
  .search-row input{ padding:16px 20px 16px 48px; }
  .search-icon{ left:18px; }
  .filter-groups{ gap:12px; }
  .filter-cluster{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
  .page-games .chip{ padding:9px 24px; }
  @media (max-width:520px){
    .controls{ padding:20px 0 22px; }
    .page-games .section-head{ margin-bottom:30px; }
    .filter-groups{ gap:10px; }
    .filter-cluster{ gap:8px; }
    .page-games .chip{ padding:8px 15px; font-size:.9rem; }
  }


  /* ===== 第二頁統一成首頁的暖褐色系：選單、關於老師、每日小卡、頁尾 ===== */
  body:has(#pageGames:not(.hidden)){
    background-image:
      linear-gradient(rgba(255,253,247,.86), rgba(255,253,247,.86)),
      var(--bg-pattern, url('./assets/bg-pattern-1.webp'));
  }
  .corner-nav-toggle{ border-color:#e4d6b8; color:#4a3c2c; background:rgba(255,250,240,.94); box-shadow:0 8px 20px -8px rgba(74,60,44,.3); }
  .corner-nav-toggle .dot{ background:#dcb56c; box-shadow:0 0 6px #dcb56c; }
  .corner-nav-panel{ background:rgba(255,250,240,.98); border-color:#e4d6b8; box-shadow:0 16px 34px -10px rgba(74,60,44,.3); }
  .nav-brand{ color:#4a3c2c; border-bottom-color:#e9dcc0; }
  .nav-links a{ font-family:var(--font-serif); font-weight:700; color:#6e5d49; padding:2px 0; }
  .nav-links a:hover{ color:#a9824a; }
  .about-card{ background:#fffaf0; border-color:#e9dcc0; box-shadow:0 10px 22px -16px rgba(74,60,44,.35); }
  .about-card::before, .about-card::after{ border-color:#dcb56c; }
  .about-card h3{ color:#4a3c2c; }
  .egg-btn{ background:#fffaf0; border-color:#e4d6b8; box-shadow:0 10px 24px -8px rgba(74,60,44,.3); }
  .egg-card{ background:#fffaf0; border-color:#e4d6b8; box-shadow:0 16px 34px -10px rgba(74,60,44,.3); }
  .egg-card h4{
    display:inline-block;
    background:#dcb56c; color:#4a3c2c;
    font-family:var(--font-serif); font-weight:900; font-size:.85rem;
    padding:2px 12px; border-radius:8px; margin-bottom:10px;
  }
  .egg-card p{ font-family:var(--font-serif); font-weight:600; color:#4a3c2c; line-height:1.7; font-size:.93rem; }
  .search-row input::placeholder{ font-family:var(--font-serif); color:#a39378; }
  footer{ padding:10px 20px 46px; }
  .footer-ornament{ display:block; width:min(220px, 55%); margin:0 auto 10px; opacity:.85; }
  footer p{ font-family:var(--font-serif); font-weight:700; color:#6e5d49; font-size:.88rem; }
  footer .footer-line{ margin-top:4px; font-weight:600; color:#8a7a62; font-size:.8rem; }

  /* ===== 年級分區標題 ===== */
  .group-head{
    grid-column:1 / -1;
    display:flex;
    align-items:center;
    gap:14px;
    margin:10px 0 0;
  }
  .group-head:first-child{ margin-top:0; }
  .group-label{
    font-family:var(--font-serif);
    font-weight:900;
    font-size:1.05rem;
    color:#4a3c2c;
    background:rgba(220,181,108,.35);
    padding:4px 16px;
    border-radius:999px;
    white-space:nowrap;
  }
  .group-rule{ flex:1; height:1px; background:linear-gradient(90deg, #dcb56c, rgba(220,181,108,0)); }

  /* ===== 動態細節：首頁按鈕呼吸、箭頭微移、插圖輕浮動；卡片按壓回饋 ===== */
  .hero-cta{ animation:cta-breathe 2.8s ease-in-out infinite; }
  .hero-cta:hover{ animation:none; }
  @keyframes cta-breathe{
    0%,100%{ box-shadow:0 6px 0 #a9824a, 0 0 0 0 rgba(220,181,108,.55); }
    50%{ box-shadow:0 6px 0 #a9824a, 0 0 0 10px rgba(220,181,108,0); }
  }
  .cta-arrow{ display:inline-block; animation:cta-nudge 1.6s ease-in-out infinite; }
  @keyframes cta-nudge{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
  .hero-frame{ animation:hero-float 7s ease-in-out infinite; }
  @keyframes hero-float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
  .card:active{ transform:translateY(-2px) scale(.99); }
  @media (prefers-reduced-motion:reduce){
    .hero-cta, .cta-arrow, .hero-frame{ animation:none; }
    .reveal{ transition:none; }
  }

  /* ===== 緊湊版卡片排版：圖示與標題並排，難度與按鈕同一行 ===== */
  .grid{ grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:18px; }
  .card{
    display:grid;
    grid-template-columns:56px 1fr auto;
    column-gap:14px;
    row-gap:6px;
    align-items:center;
    padding:16px 18px 16px;
    border-top-width:3px;
  }
  .card-icon{ grid-column:1; grid-row:1 / span 2; width:56px; height:56px; border-radius:14px; }
  .card-eyebrow{ grid-column:2 / 4; grid-row:1; margin:0; align-self:end; justify-self:start; padding:2px 10px; font-size:.72rem; }
  .card h3{ grid-column:2 / 4; grid-row:2; align-self:start; font-size:1.3rem; line-height:1.25; }
  .card .desc{ grid-column:1 / 4; grid-row:3; margin-top:6px; font-size:.88rem; line-height:1.6; flex:none; }
  .meter-row{ grid-column:1 / 3; grid-row:4; margin-top:6px; }
  .play-link{ grid-column:3; grid-row:4; margin:6px 0 0; padding:6px 14px; font-size:.88rem; align-self:center; justify-self:end; }
  .played-mark{ top:10px; right:12px; }
  @media (max-width:420px){
    .grid{ grid-template-columns:1fr; }
  }


  /* ===== 水彩圖示：不加框，放大一點讓細節看得清楚 ===== */
  .card{ grid-template-columns:72px 1fr auto; }
  .card-icon{ width:72px; height:72px; }
  .card-icon:has(img){ background:transparent; border:none; box-shadow:none; overflow:visible; border-radius:0; }
  .card-icon:has(img) img{ filter:drop-shadow(0 3px 5px rgba(74,60,44,.18)); }

  /* ===== About section ===== */
  .about{ padding:10px 0 76px; }

  .about-card{
    max-width:640px;
    margin:0 auto;
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:32px;
    text-align:center;
    position:relative;
  }

  .about-card::before, .about-card::after{
    content:'';
    position:absolute;
    width:16px; height:16px;
    border:2px solid var(--yellow);
    opacity:.5;
  }
  .about-card::before{ top:10px; left:10px; border-right:none; border-bottom:none; }
  .about-card::after{ bottom:10px; right:10px; border-left:none; border-top:none; }

  .about-card .about-icon{
    width:112px; height:112px;
    margin:0 auto 12px;
    border-radius:50%;
    overflow:hidden;
    background:#f3e6c8;
    display:flex; align-items:center; justify-content:center;
  }
  .about-card .about-icon img{ width:100%; height:100%; object-fit:contain; padding:14px; box-sizing:border-box; }
  .about-card h3{ font-family:var(--font-serif); font-size:1.15rem; font-weight:700; color:var(--ink); }
  .about-card p{ margin-top:10px; color:var(--ink-soft); font-size:.92rem; }

  /* ===== Easter egg ===== */
  .egg-next{
    margin-top:10px;
    padding:6px 14px;
    border:none;

  /* ---- 關於老師 ---- */

  /* =====================================================================

  /* 1. 標題貼紙「啪」地貼上 */
  .headline-highlight{ animation:sticker-slam .7s cubic-bezier(.2,.9,.3,1) .45s backwards; }
  @keyframes sticker-slam{
    0%{ opacity:0; transform:scale(1.9) rotate(-9deg); }
    55%{ opacity:1; transform:scale(.94) rotate(-.5deg); }

  .card.reveal.in-view:active{ transform:translate(2px,2px); }
  .card .card-icon{ transform:scale(.4) rotate(-14deg); opacity:0; transition:transform .55s cubic-bezier(.3,1.9,.5,1) .3s, opacity .2s ease .3s; }
  .card.in-view .card-icon{ transform:none; opacity:1; }
  .card > *:not(.played-mark){ position:relative; }
  .card > .played-mark{ position:absolute; }

/* ---------- 卡片渲染 ---------- */
const gridEl = document.getElementById('gameGrid');
const emptyEl = document.getElementById('emptyState');

function meterHTML(n){
  let s = '<div class="meter">';
  for(let i=1;i<=5;i++){
    s += `<span class="${i<=n ? 'on' : ''}"></span>`;
  }
  s += '</div>';
  return s;
}

function difficultyLabel(n){
  if (n <= 2) return '初級';
  if (n <= 3) return '中級';
  return '高級';
}

function iconHTML(icon){
  // 支援兩種寫法：圖片路徑（./assets/xxx.webp）或還沒做圖示前先用 emoji 佔位
  const isImage = /\.(webp|png|jpe?g|svg)$/i.test(icon);
  return isImage
    ? `<img src="${icon}" alt="" loading="lazy" decoding="async">`
    : `<span class="card-icon-emoji">${icon}</span>`;
}

/* 新遊戲標籤：在遊戲資料裡加一行 newUntil: '2026-11-30'，到期日前卡片右上角會顯示橘色 NEW 貼紙，過期自動消失 */
function isNewGame(g){
  if (!g.newUntil) return false;
  const end = new Date(g.newUntil + 'T23:59:59');
  return !isNaN(end) && new Date() <= end;
}

function renderGrid(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = games.filter(g => {
    const matchesFilter = activeFilter === 'all' || g.category === activeFilter;
    const matchesSearch = !q || g.name.toLowerCase().includes(q) || g.unit.toLowerCase().includes(q) || g.desc.toLowerCase().includes(q);
    return matchesFilter && matchesSearch;
  });

  gridEl.innerHTML = '';
  emptyEl.style.display = filtered.length ? 'none' : 'block';

  const categoryHasNoGamesAtAll = activeFilter !== 'all' && !games.some(g => g.category === activeFilter);
  emptyEl.textContent = categoryHasNoGamesAtAll
    ? '這個單元的遊戲還在製作中，敬請期待！'
    : '找不到符合條件的遊戲，換個關鍵字或篩選試試看。';

  const accents = ['accent-teal', 'accent-blue', 'accent-gold', 'accent-green'];

  // 「全部」且沒有搜尋時，依年級分區顯示；其餘情況維持單一清單
  const grouped = activeFilter === 'all' && !q;
  const groupTitles = { '8up':'八年級・上學期', '8down':'八年級・下學期', '9up':'九年級・上學期', '9down':'九年級・下學期' };
  const order = ['8up','8down','9up','9down'];
  if (grouped) filtered.sort((a,b) => order.indexOf(a.category) - order.indexOf(b.category));
  let lastCat = null;

  filtered.forEach((g, i) => {
    if (grouped && g.category !== lastCat) {
      lastCat = g.category;
      const head = document.createElement('div');
      head.className = 'group-head reveal';
      head.innerHTML = `<span class="group-label">${groupTitles[g.category] || g.category}</span><span class="group-rule"></span>`;
      gridEl.appendChild(head);
    }
    const card = document.createElement('article');
    const accent = accents[i % accents.length];
    const isNew = isNewGame(g);
    card.className = `card reveal ${accent}` + (playedGames.includes(g.id) ? ' is-played' : '') + (isNew ? ' has-new' : '');

    card.innerHTML = `
      <span class="played-mark">已探索</span>
      ${isNew ? '<span class="new-badge">NEW</span>' : ''}
      <span class="card-icon">${iconHTML(g.icon)}</span>
      <div class="card-eyebrow">${g.unit}</div>
      <h3>${g.name}</h3>
      <p class="desc">${g.desc}</p>
      <div class="meter-row">
        <span class="meter-label">難度</span>
        ${meterHTML(g.difficulty)}
        <span class="difficulty-label">${difficultyLabel(g.difficulty)}</span>
      </div>
      ${g.link ? `<a class="play-link" href="${g.link}">進入遊戲 →</a>` : '<span class="play-link is-soon">即將開放</span>'}
    `;

    card.style.transitionDelay = ((i % 3) * 70) + 'ms';
    if (g.link) card.querySelector('.play-link').addEventListener('click', () => markPlayed(g.id));
    else card.classList.add('is-soon');
    // 整張卡片都能點（觸控裝置比較好按）；點到連結本身時交給連結處理
    card.addEventListener('click', (e) => { if (!g.link || e.target.closest('a')) return; card.querySelector('.play-link').click(); });
    gridEl.appendChild(card);
  });

  observeReveal();
}

/* ---------- 捲動淡入效果（scroll-reveal）---------- */
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('in-view');
      const t = entry.target; setTimeout(() => { t.style.transitionDelay = '0ms'; }, 1200);
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.12 });

function observeReveal(){
  document.querySelectorAll('.reveal:not(.in-view)').forEach(el => revealObserver.observe(el));
}

function markPlayed(id){
  if(!playedGames.includes(id)){
    playedGames.push(id);
    localStorage.setItem('labPassPlayed', JSON.stringify(playedGames));
    renderGrid();
  }
}

document.getElementById('searchInput').addEventListener('input', renderGrid);

function switchPage(fromEl, toEl, targetId){
  fromEl.classList.add('leaving');
  setTimeout(() => {
    fromEl.classList.remove('leaving');
    fromEl.classList.add('hidden');
    toEl.classList.remove('hidden');
    window.scrollTo(0, 0);
    if (targetId) {
      requestAnimationFrame(() => {
        document.getElementById(targetId)?.scrollIntoView({ behavior: 'smooth' });
      });
    }
  }, 300);
}

function goToGames(targetId){ switchPage(pageStart, pageGames, targetId || 'games'); }
function goToStart(){ switchPage(pageGames, pageStart); }

heroCta.addEventListener('click', () => goToGames('games'));

/* 如果是從遊戲頁點「返回」連結過來（網址帶 #games），
   直接顯示遊戲清單頁，不用再按一次「開始探索遊戲」 */
if (window.location.hash === '#games') {
  pageStart.classList.add('hidden');
  pageGames.classList.remove('hidden');
}
navBackHome.addEventListener('click', (e) => { e.preventDefault(); goToStart(); });

document.querySelectorAll('.nav-links a[href^="#"]:not(#navBackHome)').forEach(link => {
  link.addEventListener('click', (e) => {
    e.preventDefault();
    goToGames(link.getAttribute('href').slice(1));
  });
});

/* ---------- 右上角導覽選單 ---------- */
const navToggle = document.getElementById('navToggle');
const navPanel = document.getElementById('navPanel');

navToggle.addEventListener('click', () => {
  const isOpen = navPanel.classList.toggle('open');
  navToggle.setAttribute('aria-expanded', isOpen);
});

document.querySelectorAll('.nav-links a').forEach(link => {
  link.addEventListener('click', () => {
    navPanel.classList.remove('open');
    navToggle.setAttribute('aria-expanded', 'false');
  });
});

document.addEventListener('click', (e) => {
  if (!navPanel.contains(e.target) && !navToggle.contains(e.target)) {
    navPanel.classList.remove('open');
    navToggle.setAttribute('aria-expanded', 'false');
  }
});

/* ---------- 每日理化小卡 ---------- */
const eggBtn = document.getElementById('eggBtn');
const eggCard = document.getElementById('eggCard');
const eggText = document.getElementById('eggText');
function pickFact(){
  // 每次打開網頁隨機抽一張，並避免連續兩次抽到同一張
  let last = -1;
  try { last = parseInt(localStorage.getItem('labPassLastFact'), 10); } catch(e){}
  let i;
  do { i = Math.floor(Math.random() * dailyFacts.length); }
  while (dailyFacts.length > 1 && i === last);
  try { localStorage.setItem('labPassLastFact', String(i)); } catch(e){}
  eggText.textContent = dailyFacts[i];
}
pickFact();
document.getElementById('gameCountPill').textContent = '🎮 ' + games.filter(g => g.link).length + ' 款探索遊戲';
document.getElementById('eggNext').addEventListener('click', () => {
  // 抽卡：卡片翻面，翻到側面時換內容
  eggCard.classList.remove('flip'); void eggCard.offsetWidth; eggCard.classList.add('flip');
  setTimeout(pickFact, 230);
});

eggBtn.addEventListener('click', () => {
  const isOpen = eggCard.classList.toggle('open');
  eggBtn.setAttribute('aria-expanded', isOpen);
});

document.addEventListener('click', (e) => {
  if (!eggCard.contains(e.target) && !eggBtn.contains(e.target)) {
    eggCard.classList.remove('open');
    eggBtn.setAttribute('aria-expanded', 'false');
  }
});
</script>
